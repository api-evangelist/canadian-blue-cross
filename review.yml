  acordPosture:
    posture: no ACORD reference found
    evidence: >-
      Zero occurrences of "ACORD", "AL3", "ACORD XML", or "NGDS" across all 40 pages
      fetched from bluecross.ca (all 27 site pages plus all 13 regional pages). This is
      expected rather than surprising: ACORD is a property-and-casualty data-standards
      body, and Blue Cross Canada is a health, dental, travel, group-benefits and life
      carrier federation. The relevant Canadian standards seam for this book of business
      is health-claim adjudication rails (CLHIA / pharmacy claim standards and
      third-party provider e-claims networks), none of which are documented publicly by
      the association either. IVANS / agency-download / Applied Epic / Vertafore AMS360
      are US P&C agency-management concepts and are correctly absent here.
  insuranceVerbs:
    quote:
      exposed: false
      note: Consumer quoting is HTML web flows on each member plan's site; no API.
    bind:
      exposed: false
    issue:
      exposed: false
    fnol:
      exposed: false
      note: >-
        Claims submission exists only inside authenticated member portals and mobile
        apps ("Make a Claim" at /memberweb/), and via provider-side e-claims rails. No
        public FNOL or claims API is documented.
    audience: none-public
    note: >-
      No consumer-facing, agent-facing, or partner-facing API is published. The only
      documented integration audiences are members, plan sponsors/employers, brokers,
      and health-care providers — all behind authentication.
  authModel:
    scheme: web session login (member / plan-sponsor / provider portals)
    publicApiAuth: none
    oauthDiscovery: false
    note: >-
      No API key programme, no OAuth2 client-credentials or authorization-code flow, no
      mTLS partner onboarding, and no OIDC discovery document served on the domain.
      Authentication is human web login only.
  specs:
    openapi: 0
    swagger: 0
    asyncapi: 0
    graphql: 0
    proto: 0
    postman: 0
    note: >-
      No specification of any kind was found, so no openapi/ directory was created. No
      candidate URL returned a parseable OpenAPI or Swagger document; every candidate
      returned a 404 HTML page.
  webhooks:
    documented: false
    note: No event catalog, webhook documentation, or AsyncAPI. Absence is the finding.
  postman:
    documented: false
    note: No public Postman collection or workspace found for the association or the
      member plans probed.
  transports:
  - protocol: HTTPS
    scheme: https
    baseURL: https://www.bluecross.ca/
    documented: true
    note: Marketing website only. No documented API base URL exists.
  - protocol: REST
    documented: false
    note: >-
      No product REST API is documented. The default WordPress /wp-json/ route responds
      200 but is a CMS artifact of the publishing platform, not an insurance API.
  - protocol: GraphQL
    documented: false
  - protocol: gRPC
    documented: false
  - protocol: WebSocket
    documented: false
  - protocol: SFTP/EDI
    documented: false
    note: >-
      Bulk enrolment and claims file exchange with plan sponsors and provider networks
      is industry-standard for this book of business but is not publicly documented by
      the association, so nothing is asserted here.
marketContext: >-
  Canada has the most fragmented insurance supervision of the four markets studied. OSFI
  supervises federally-regulated insurers prudentially while the provinces regulate
  market conduct (FSRA in Ontario, AMF in Quebec). There is no open-insurance mandate,
  and Consumer-Driven Banking — Canada's open-banking framework — excludes insurance
  entirely. Blue Cross Canada's zero-API posture is therefore fully compliant behaviour,
  not a lag: nothing in the Canadian regime asks a health-and-benefits carrier
  federation to publish an API.
